services:
  orthanc:
    image: jodogne/orthanc-plugins:1.12.4
    container_name: dicomcamera-orthanc
    ports:
      - "4242:4242"   # DICOM DIMSE
      - "8042:8042"   # HTTP UI / REST
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-storage:/var/lib/orthanc/db
    restart: unless-stopped

  # HAPI FHIR R4 — FHIR Patient lookup demo (Phase 5)
  fhir:
    image: hapiproject/hapi:latest
    container_name: dicomcamera-fhir
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.reuse_cached_search_results_millis: "-1"
    restart: unless-stopped

  # Seed FHIR patients after HAPI is healthy
  fhir-seed:
    image: python:3.12-alpine
    container_name: dicomcamera-fhir-seed
    depends_on:
      - fhir
    volumes:
      - ./fhir:/seed:ro
    working_dir: /seed
    environment:
      FHIR_BASE_URL: http://fhir:8080/fhir
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    restart: "no"

  # HL7 v2 demographics HTTPS façade mock (no MLLP)
  hl7-facade:
    build: ./hl7-facade
    container_name: dicomcamera-hl7
    ports:
      - "8090:8090"
    restart: unless-stopped
