services:
  orthanc:
    image: jodogne/orthanc-plugins:1.12.4
    container_name: dicomcamera-orthanc
    ports:
      - "4242:4242"   # DICOM DIMSE
      - "8042:8042"   # HTTP UI / REST
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-storage:/var/lib/orthanc/db
    restart: unless-stopped

  # Lightweight MWL SCP for Phase 2 prep (dcm4chee-arc optional later).
  # For Phase 0, C-ECHO/C-STORE against Orthanc is enough.
  # Uncomment when ready to exercise MWL locally with a dedicated tool.

  # HAPI FHIR R4 — FHIR Patient lookup demo (Phase 5). Pin a version; :latest breaks demos.
  fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: dicomcamera-fhir
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.reuse_cached_search_results_millis: "-1"
    restart: unless-stopped

  # Seed sample Patients once HAPI answers CapabilityStatement (see fhir/seed.sh wait loop).
  fhir-seed:
    image: python:3.12-alpine
    container_name: dicomcamera-fhir-seed
    depends_on:
      - fhir
    volumes:
      - ./fhir:/seed:ro
    working_dir: /seed
    environment:
      FHIR_BASE_URL: http://fhir:8080/fhir
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    restart: "no"

  # HL7 v2 demographics HTTPS-façade mock (no MLLP) — lab only.
  hl7-facade:
    build: ./hl7-facade
    container_name: dicomcamera-hl7
    ports:
      - "8090:8090"
    restart: unless-stopped
