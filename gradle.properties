org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 defaults to a new DSL and built-in Kotlin support, both of which
# are incompatible with the explicitly-applied org.jetbrains.kotlin.android
# plugin used by this project. Opt out of both rather than migrating to
# AGP's built-in Kotlin support, which would be a separate, larger change.
android.newDsl=false
android.builtInKotlin=false
