name: Android CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :dicom:testDebugUnitTest :identity:testDebugUnitTest --stacktrace
      - name: Assemble dev debug
        run: ./gradlew :app:assembleDevDebug --stacktrace
